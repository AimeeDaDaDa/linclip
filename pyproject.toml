[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linclip"
version = "0.1.0"
description = "A small Win+V-style clipboard history for Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PySide6-Essentials>=6.6,<7"]

[project.scripts]
linclip = "linclip.__main__:main"

[tool.setuptools.packages.find]
include = ["linclip*"]

[tool.setuptools.package-data]
linclip = ["assets/*.svg"]
